<h2 align="center">Gallery</h2>
<table width="900" align="center" border="0" cellpadding="3" cellspacing="0">
<tr align="center">
<td><img src="images/tiger2.jpg" alt="Bengal Tiger" title="The Bengal Tiger is the star of Bandhavgarh, which has one of the highest tiger densities in India." width="140" height="105"></td>
<td><img src="images/leopard2.jpg" alt="Leopard" title="The Leopard is a shy and agile big cat that lives in the rocky and forested parts of the park." width="140" height="105"></td>
<td><img src="images/sloth_bear2.jpg" alt="Sloth Bear" title="The Sloth Bear feeds on termites, fruits and honey and is often seen in the Bandhavgarh forests." width="140" height="105"></td>
<td><img src="images/chital2.jpg" alt="Spotted Deer" title="The Spotted Deer (Chital) lives in herds and is the main prey of the tiger." width="140" height="105"></td>
<td><img src="images/sambar2.jpg" alt="Sambar Deer" title="The Sambar is the largest deer of the park and is found near forests and water." width="140" height="105"></td>
<td><img src="images/gaur2.jpg" alt="Indian Gaur" title="The Indian Gaur is the largest wild cattle in the world and lives in the forests of Bandhavgarh." width="140" height="105"></td>
</tr>
<tr align="center">
<td><img src="images/wild_boar2.jpg" alt="Wild Boar" title="The Wild Boar is an omnivore that moves around in groups called sounders." width="140" height="105"></td>
<td><img src="images/macaque2.jpg" alt="Rhesus Macaque" title="The Rhesus Macaque is a monkey commonly seen near the fort and roads of the park." width="140" height="105"></td>
<td><img src="images/langur2.jpg" alt="Grey Langur" title="The Grey Langur is a leaf-eating monkey whose alarm call warns other animals about tigers." width="140" height="105"></td>
<td><img src="images/peacock2.jpg" alt="Indian Peafowl" title="The Indian Peafowl is the national bird of India and is found all over the park." width="140" height="105"></td>
<td><img src="images/vulture2.jpg" alt="Vulture" title="Vultures are nature's cleaners and nest on the cliffs of Bandhavgarh." width="140" height="105"></td>
<td><img src="images/jackal2.jpg" alt="Golden Jackal" title="The Golden Jackal is a clever scavenger and hunter, often seen at dawn and dusk." width="140" height="105"></td>
</tr>
